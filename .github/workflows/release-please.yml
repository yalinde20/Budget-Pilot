name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['budget-app--release_created'] }}
      tag_name: ${{ steps.release.outputs['budget-app--tag_name'] }}
    steps:
      # Ouvre / met à jour la PR de release à partir des commits conventionnels,
      # puis crée le tag et la release GitHub quand cette PR est mergée.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: budget-app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: budget-app/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Accepte le nom manuel ou celui créé par `firebase init hosting:github`.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_BUDGETPILOT_244FB }}
          projectId: budgetpilot-244fb
          channelId: live
          entryPoint: budget-app
