<form (submit)="onSubmit($event)" class="bg-white rounded-2xl shadow-sm p-4 flex flex-col gap-3">
  <h2 class="text-sm font-medium text-gray-900">Nouvelle catégorie</h2>

  <div class="flex items-center gap-2">
    <button type="button" (click)="inputMode.set('percentage')" class="text-xs font-medium rounded-lg px-3 py-1.5 bg-gray-100 text-gray-500"
            [attr.aria-pressed]="inputMode() === 'percentage'"
            aria-label="Saisir en pourcentage"
            [class.text-white]="inputMode() === 'percentage'"
            [class.bg-teal-600]="inputMode() === 'percentage'"
    >%</button>

    <button type="button" (click)="inputMode.set('amount')" class="text-xs font-medium rounded-lg px-3 py-1.5 bg-gray-100 text-gray-500 disabled:opacity-40 disabled:cursor-not-allowed"
            [disabled]="!canUseAmountMode()"
            [attr.aria-pressed]="inputMode() === 'amount'"
            aria-label="Saisir en euros"
            [class.text-white]="inputMode() === 'amount'"
            [class.bg-teal-600]="inputMode() === 'amount'"
    >€</button>

    @if (!canUseAmountMode()) {
      <span class="text-xs text-gray-400">Renseigne d'abord un revenu</span>
    }
  </div>

  <div class="flex items-center gap-2">
    <input type="text" [value]="name()" (input)="onNameInput($event)" placeholder="Nom de la catégorie"
           aria-label="Nom de la catégorie" autocomplete="off" enterkeyhint="done"
           class="flex-1 min-w-0 text-base sm:text-sm border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-teal-500">
    @if (inputMode() === 'percentage') {
      <input type="text" inputmode="decimal" [value]="formatDecimal(percentage())" (input)="onPercentageInput($event)" placeholder="%"
             aria-label="Pourcentage du revenu" autocomplete="off" enterkeyhint="done"
             class="w-20 text-base sm:text-sm border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-teal-500">
    } @else {
      <input type="text" inputmode="decimal" [value]="formatDecimal(amount())" (input)="onAmountInput($event)" placeholder="€"
             aria-label="Montant en euros" autocomplete="off" enterkeyhint="done"
             class="w-20 text-base sm:text-sm border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-teal-500">
    }
  </div>

  <div class="grid grid-cols-8 gap-1 sm:flex" role="group" aria-label="Icône">
    @for (i of availableIcons; track i.id) {
      <button type="button" (click)="icon.set(i.id)"
              [attr.aria-label]="i.label" [attr.aria-pressed]="icon() === i.id" [title]="i.label"
              [class.ring-2]="icon() === i.id" [class.ring-teal-500]="icon() === i.id"
              class="aspect-square sm:w-8 sm:h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-600">
        <app-icon [name]="i.id" [size]="18" />
      </button>
    }
  </div>

  <div class="flex flex-wrap gap-2 sm:gap-1" role="group" aria-label="Couleur">
    @for (c of availableColors; track c.value) {
      <button type="button" (click)="color.set(c.value)"
              [attr.aria-label]="c.label" [attr.aria-pressed]="color() === c.value" [title]="c.label"
              class="w-8 h-8 sm:w-6 sm:h-6 rounded-full"
              [style.background-color]="c.value"
              [class.border-2]="color() === c.value"
              [class.border-gray-900]="color() === c.value">
      </button>
    }
  </div>

  <button type="submit" [disabled]="!isValid()"
          class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium rounded-lg px-4 py-2 transition-colors self-start disabled:opacity-40 disabled:cursor-not-allowed">
    Ajouter
  </button>
</form>
