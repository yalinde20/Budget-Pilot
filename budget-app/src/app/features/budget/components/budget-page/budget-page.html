<main class="pt-8 pb-10 sm:py-14 px-4">
  <div class="max-w-xl lg:max-w-5xl mx-auto">

    <h1 class="text-2xl font-semibold text-gray-900 mb-6 sm:mb-8">Mon budget</h1>

    <!-- Mobile : une colonne. Ordinateur (lg) : saisie à gauche, liste à droite. -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-8 lg:items-start">
      <section class="space-y-4 lg:sticky lg:top-8" aria-label="Revenu et nouvelle catégorie">
        <app-income-input
          [income]="budgetService.income()"
          (incomeChange)="budgetService.updateIncome($event)">
        </app-income-input>

        <app-allocation-summary
          [totalPercentage]="budgetService.totalPercentage()"
          [remainingPercentage]="budgetService.remainingPercentage()">
        </app-allocation-summary>

        <app-category-form
          [income]="budgetService.income()"
          (categoryAdded)="budgetService.addCategory($event)">
        </app-category-form>
      </section>

      <section aria-labelledby="categories-title">
        @if (budgetService.categoriesWithAmounts().length >= 2) {
          <app-allocation-chart
            class="mb-6"
            [categories]="budgetService.categoriesWithAmounts()"
            [income]="budgetService.income()" />
        }
        <h2 id="categories-title" class="text-sm font-medium text-gray-500 mb-3 lg:mt-0">Catégories</h2>
        <app-category-list
          [income]="budgetService.income()"
          [categoryList]="budgetService.categoriesWithAmounts()"
          (categoryRemoved)="budgetService.removeCategory($event)"
          (categoryUpdated)="budgetService.updateCategory($event.id, $event.changes)">
        </app-category-list>
      </section>
    </div>

    <app-backup-panel class="mt-8" />

  </div>
</main>
