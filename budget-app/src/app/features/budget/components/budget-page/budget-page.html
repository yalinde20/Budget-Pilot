<main class="pt-8 pb-10 sm:py-14 px-4">
  <div class="max-w-xl lg:max-w-5xl mx-auto">

    <h1 class="text-2xl font-semibold text-gray-900 mb-6 sm:mb-8">Mon budget</h1>

    <!-- Mobile : une colonne. Ordinateur (lg) : saisie à gauche, liste à droite. -->
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 lg:gap-8 lg:items-start">
      <section class="space-y-4 lg:sticky lg:top-8" aria-label="Revenu et nouvelle catégorie">
        <app-income-input
          [income]="budgetService.income()"
          (incomeChange)="budgetService.updateIncome($event)">
        </app-income-input>

        <app-allocation-summary
          [totalPercentage]="budgetService.totalPercentage()"
          [remainingPercentage]="budgetService.remainingPercentage()">
        </app-allocation-summary>

        <app-category-form
          [income]="budgetService.income()"
          [usedColors]="usedColors()"
          (categoryAdded)="budgetService.addCategory($event)">
        </app-category-form>
      </section>

      <section aria-labelledby="categories-title">
        @if (budgetService.categoriesWithAmounts().length >= 2) {
          <app-allocation-chart
            class="mb-6"
            [categories]="budgetService.categoriesWithAmounts()"
            [income]="budgetService.income()" />
        }
        <h2 id="categories-title" class="text-sm font-medium text-gray-500 mb-3 lg:mt-0">Catégories</h2>
        <app-category-list
          [income]="budgetService.income()"
          [categoryList]="budgetService.categoriesWithAmounts()"
          (categoryRemoved)="onCategoryRemoved($event)"
          (categoryMoved)="budgetService.moveCategory($event.fromIndex, $event.toIndex)"
          (categoryNudged)="budgetService.nudgeCategory($event.id, $event.offset)"
          (categoryUpdated)="budgetService.updateCategory($event.id, $event.changes)">
        </app-category-list>
      </section>
    </div>

    <app-backup-panel class="mt-8" />

  </div>
</main>

<!-- Annulation de la dernière suppression -->
@if (lastRemoved(); as removed) {
  <div role="status"
       class="fixed inset-x-4 bottom-[calc(1rem+env(safe-area-inset-bottom))] z-40 mx-auto max-w-md
              bg-gray-900 text-white rounded-2xl shadow-lg pl-4 pr-2 py-2 flex items-center gap-2"
       (mouseenter)="stopUndoTimer()" (mouseleave)="startUndoTimer()"
       (focusin)="stopUndoTimer()" (focusout)="startUndoTimer()">
    <span class="flex-1 min-w-0 flex text-sm">
      <span class="truncate">« {{ removed.category.name }}</span>
      <span class="shrink-0 whitespace-pre"> » supprimée</span>
    </span>
    <button type="button" (click)="undoRemove()"
            class="shrink-0 text-sm font-semibold text-teal-300 hover:text-teal-200 rounded-lg px-3 py-2">
      Annuler
    </button>
    <button type="button" (click)="dismissUndo()" aria-label="Fermer"
            class="shrink-0 w-9 h-9 flex items-center justify-center rounded-lg text-gray-400 hover:text-white">
      <app-icon name="x" [size]="16" />
    </button>
  </div>
}
