<div class="bg-white rounded-2xl shadow-sm p-5 focus-within:ring-2 focus-within:ring-teal-500 transition-shadow dark:bg-gray-900">
  <label for="income" class="block text-sm text-gray-500 mb-1 dark:text-gray-400">Revenu mensuel</label>
  <div class="flex items-baseline gap-1">
    <input
      id="income"
      type="text"
      inputmode="decimal"
      autocomplete="off"
      enterkeyhint="done"
      [value]="formatDecimal(income())"
      (input)="onIncomeInput($event)"
      placeholder="0"
      class="w-full min-w-0 text-3xl font-medium text-gray-900 border-none outline-none p-0 bg-transparent dark:text-gray-100">
    <span class="text-xl text-gray-400 dark:text-gray-500">€</span>
  </div>
</div>
