<div class=
  "rounded-2xl px-4 py-3 flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between text-sm font-medium"
  [class.bg-amber-50]="remainingPercentage() > 0"
  [class.text-amber-700]="remainingPercentage() > 0"
  [class.bg-red-50]="remainingPercentage() < 0"
  [class.text-red-700]="remainingPercentage() < 0"
  [class.bg-teal-50]="remainingPercentage() === 0"
  [class.text-teal-700]="remainingPercentage() === 0">
  <span>Total réparti : {{ totalPercentage() }} %</span>
  @if (remainingPercentage() > 0) {
    <span>Il reste {{ remainingPercentage() }} %</span>
  } @else if (remainingPercentage() < 0) {
    <span>Vous avez dépassé le total de : {{ -remainingPercentage() }} %</span>
  } @else {
    <span>100 % réparti</span>
  }
</div>
