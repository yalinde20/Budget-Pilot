<div class=
  "rounded-2xl px-4 py-3 flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between text-sm font-medium"
  [class]="toneClasses()">
  <span>Total réparti : {{ totalPercentage() | number:'1.0-2' }} %</span>
  @if (remainingPercentage() > 0) {
    <span>Il reste {{ remainingPercentage() | number:'1.0-2' }} %</span>
  } @else if (remainingPercentage() < 0) {
    <span>Vous avez dépassé le total de : {{ -remainingPercentage() | number:'1.0-2' }} %</span>
  } @else {
    <span>100 % réparti</span>
  }
</div>
