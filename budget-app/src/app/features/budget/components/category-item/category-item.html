@if (!isEditing()) {
  <div class="bg-white rounded-2xl shadow-sm p-4 flex items-center gap-3">
    <div class="w-9 h-9 rounded-lg bg-gray-50 flex items-center justify-center shrink-0"
         [style.color]="category().color || '#94a3b8'">
      <app-icon [name]="category().icon || 'ti-tag'" />
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between gap-2 mb-2">
        <span class="text-sm font-medium text-gray-900 truncate">{{ category().name }}</span>
        <span class="text-sm font-medium text-gray-900 whitespace-nowrap">{{ category().amount | currency:'EUR' }}</span>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full rounded-full" [style.width.%]="category().percentage" [style.background-color]="category().color || '#94a3b8'"></div>
        </div>
        <span class="text-xs text-gray-400 w-16 text-right whitespace-nowrap">{{ category().percentage | number:'1.0-2' }} %</span>
      </div>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button type="button" (click)="onEditStart()" [attr.aria-label]="'Modifier ' + category().name" title="Modifier"
              class="w-10 h-10 flex items-center justify-center rounded-lg text-gray-400 hover:text-teal-600 hover:bg-gray-50 transition-colors">
        <app-icon name="pencil" [size]="18" />
      </button>
      <button type="button" (click)="onRemove()" [attr.aria-label]="'Supprimer ' + category().name" title="Supprimer"
              class="w-10 h-10 flex items-center justify-center rounded-lg text-gray-400 hover:text-red-500 hover:bg-gray-50 transition-colors">
        <app-icon name="trash" [size]="18" />
      </button>
    </div>
  </div>
} @else {
  <form (submit)="onEditSave($event)" (keydown.escape)="onEditCancel()"
        class="bg-white rounded-2xl shadow-sm p-4 flex flex-col gap-2">
    <div class="flex items-center gap-2">
      <button type="button" (click)="draftInputMode.set('percentage')"
              [attr.aria-pressed]="draftInputMode() === 'percentage'" aria-label="Saisir en pourcentage"
              class="text-xs font-medium rounded-lg px-3 py-1.5 bg-gray-100 text-gray-500"
              [class.text-white]="draftInputMode() === 'percentage'"
              [class.bg-teal-600]="draftInputMode() === 'percentage'">%</button>
      <button type="button" (click)="draftInputMode.set('amount')"
              [disabled]="!canUseAmountMode()"
              [attr.aria-pressed]="draftInputMode() === 'amount'" aria-label="Saisir en euros"
              class="text-xs font-medium rounded-lg px-3 py-1.5 bg-gray-100 text-gray-500 disabled:opacity-40 disabled:cursor-not-allowed"
              [class.text-white]="draftInputMode() === 'amount'"
              [class.bg-teal-600]="draftInputMode() === 'amount'">€</button>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <input type="text" aria-label="Nom de la catégorie" autocomplete="off" enterkeyhint="done"
             class="flex-1 min-w-0 text-base sm:text-sm border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-teal-500"
             [value]="draftName()" (input)="onDraftNameInput($event)">
      @if (draftInputMode() === 'percentage') {
        <input type="text" inputmode="decimal" aria-label="Pourcentage du revenu" autocomplete="off" enterkeyhint="done"
               class="w-20 text-base sm:text-sm border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-teal-500"
               [value]="formatDecimal(draftPercentage())" (input)="onDraftPercentageInput($event)">
      } @else {
        <input type="text" inputmode="decimal" aria-label="Montant en euros" autocomplete="off" enterkeyhint="done"
               class="w-20 text-base sm:text-sm border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-teal-500"
               [value]="formatDecimal(draftAmount())" (input)="onDraftAmountInput($event)">
      }
      <button type="submit"
              class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-medium rounded-lg px-3 py-2 transition-colors shrink-0 disabled:opacity-40 disabled:cursor-not-allowed"
              [disabled]="!isDraftValid()">
        Enregistrer
      </button>
      <button type="button" class="text-gray-400 hover:text-gray-600 text-sm px-2 py-2 shrink-0" (click)="onEditCancel()">
        Annuler
      </button>
    </div>
  </form>
}
