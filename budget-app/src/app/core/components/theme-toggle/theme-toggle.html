<div role="group" aria-label="Thème"
     class="flex items-center gap-0.5 rounded-xl bg-gray-100 dark:bg-gray-800 p-0.5">
  @for (option of options; track option.value) {
    <button type="button" (click)="theme.setPreference(option.value)"
            [attr.aria-label]="option.label" [attr.aria-pressed]="theme.preference() === option.value"
            [title]="option.label"
            class="w-9 h-9 flex items-center justify-center rounded-lg transition-colors
                   text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100
                   aria-pressed:bg-white aria-pressed:text-teal-700 aria-pressed:shadow-sm
                   dark:aria-pressed:bg-gray-700 dark:aria-pressed:text-teal-300">
      <app-icon [name]="option.icon" [size]="18" />
    </button>
  }
</div>
