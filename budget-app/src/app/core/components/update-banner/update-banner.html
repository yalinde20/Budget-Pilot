@if (appUpdate.updateAvailable()) {
  <div role="status"
       class="fixed inset-x-4 bottom-[calc(1rem+env(safe-area-inset-bottom))] z-50 mx-auto max-w-md
              bg-gray-900 text-white rounded-2xl shadow-lg px-4 py-3 flex items-center gap-3">
    <span class="flex-1 text-sm">Une nouvelle version est disponible.</span>
    <button type="button" (click)="appUpdate.applyUpdate()"
            class="flex items-center gap-1.5 bg-teal-500 hover:bg-teal-400 text-white text-sm font-medium rounded-lg px-3 py-2 transition-colors shrink-0">
      <app-icon name="refresh" [size]="16" />
      Mettre à jour
    </button>
  </div>
}
