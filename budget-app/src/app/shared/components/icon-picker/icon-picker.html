<button #toggleButton type="button" (click)="toggle()"
        [attr.aria-expanded]="open()" [attr.aria-controls]="panelId"
        class="flex items-center gap-2 rounded-lg border border-gray-200 hover:border-gray-300 bg-white pl-1.5 pr-3 py-1.5 text-sm text-gray-700 dark:border-gray-700 dark:hover:border-gray-600 dark:bg-gray-900 dark:text-gray-300">
  <span class="w-8 h-8 rounded-md bg-gray-100 flex items-center justify-center text-gray-700 dark:bg-gray-800 dark:text-gray-300">
    <app-icon [name]="value()" [size]="18" />
  </span>
  <span>Icône : <span class="font-medium">{{ label() }}</span></span>
  <span class="text-gray-400 text-xs dark:text-gray-500" aria-hidden="true">{{ open() ? '▲' : '▼' }}</span>
</button>

@if (open()) {
  <div [id]="panelId" role="group" aria-label="Choisir une icône"
       class="mt-2 rounded-xl border border-gray-200 bg-white p-3 flex flex-col gap-2 dark:border-gray-700 dark:bg-gray-900">
    <input #search type="search" [value]="query()" (input)="onSearch($event)"
           placeholder="Rechercher : voiture, loyer, santé…" aria-label="Rechercher une icône"
           autocomplete="off" enterkeyhint="search"
           class="w-full text-base sm:text-sm border border-gray-200 rounded-lg px-3 py-2 outline-none focus:border-teal-500 dark:border-gray-700">

    @if (results().length > 0) {
      <div class="grid grid-cols-6 sm:grid-cols-8 gap-1 max-h-56 overflow-y-auto">
        @for (icon of results(); track icon.id) {
          <button type="button" (click)="select(icon.id)"
                  [attr.aria-label]="icon.label" [attr.aria-pressed]="value() === icon.id" [title]="icon.label"
                  class="aspect-square rounded-lg bg-gray-50 hover:bg-gray-100 flex items-center justify-center text-gray-700
                         aria-pressed:ring-2 aria-pressed:ring-teal-500 aria-pressed:bg-teal-50
                         dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-gray-300 dark:aria-pressed:bg-teal-950">
            <app-icon [name]="icon.id" [size]="20" />
          </button>
        }
      </div>
    } @else {
      <p class="text-sm text-gray-400 text-center py-4 dark:text-gray-500">Aucune icône pour « {{ query() }} »</p>
    }
  </div>
}
