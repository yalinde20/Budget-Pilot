<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>BudgetPilot</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Répartis ton revenu mensuel en catégories et suis ton budget.">
  <meta name="theme-color" content="#f9fafb">
  <script>
    // Applique le thème avant l'affichage, pour éviter un flash clair au démarrage.
    // Mêmes règles que ThemeService (clé « theme » du stockage local, couleurs).
    (function () {
      var preference = null;
      try {
        preference = JSON.parse(localStorage.getItem('theme'));
      } catch (e) {}
      var dark = preference === 'dark' ||
        (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#030712');
      }
    })();
  </script>
  <meta name="format-detection" content="telephone=no">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- iOS / iPadOS : écran d'accueil (Safari → Partager → « Sur l'écran d'accueil ») -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BudgetPilot">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Active JavaScript pour utiliser BudgetPilot.</noscript>
</body>
</html>
